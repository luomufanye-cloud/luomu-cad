[project]
name = "luomu-cad"
version = "0.3.11"
description = "CAD drawing automation, measured DXF checks and source-linked reference research"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{name = "luomufanye-cloud"}]
dependencies = [
  "mcp==1.30.0", "ezdxf>=1.4,<2", "shapely>=2.1,<3", "ortools>=9.14,<10",
  "matplotlib>=3.10,<4", "Pillow>=11,<13", "scrapling==0.5", "httpx>=0.28,<1", "protego>=0.6,<1",
  "pywin32==312; sys_platform == 'win32'",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
[project.scripts]
luomu-cad = "luomu_cad.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/luomu_cad"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
