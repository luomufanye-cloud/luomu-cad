name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.5'
      - run: uv sync --python 3.11 --locked --extra dev --no-editable
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python scripts/build_release.py
