name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.5'
      - run: uv sync --python 3.11 --locked --extra dev --no-editable
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python scripts/build_release.py
  release:
    needs: test
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    env:
      LUOMU_CAD_LIVE_WRITES: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.5'
      - run: uv sync --python 3.11 --locked --extra dev --no-editable
      # The version comes from the package itself; tests/test_installation.py keeps
      # pyproject, uv.lock, package.json, capabilities.yaml and README in step.
      - name: Read release version
        id: version
        run: |
          version=$(uv run --no-sync python -c 'from luomu_cad import __version__; print(__version__)')
          notes="references/release-validation-${version%.*}.md"
          test -f "$notes" || { echo "Missing release notes: $notes"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
      - name: Build and verify universal release package
        run: |
          uv run --no-sync python scripts/build_release.py
          uv run --no-sync python scripts/release_smoke.py
      - name: Publish version-pinned release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version already exists; refusing to overwrite release or assets."
            exit 1
          fi
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Luomu CAD $VERSION" --latest \
            --notes-file "$NOTES" \
            "dist/luomu-cad-$VERSION-source.zip"
